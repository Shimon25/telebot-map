<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Карта Детских Мероприятий</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .event-popup {
            font-size: 14px;
            line-height: 1.4;
        }
        .event-title {
            font-weight: bold;
            color: #111;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .event-meta {
            color: #555;
            margin-bottom: 3px;
        }
        .popup-link {
            display: block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #2481cc;
            color: white !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
            font-size: 13px;
        }
        .popup-link:active {
            background-color: #1a6299;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Инициализируем контекст Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Парсим параметры города (?city=Хайфа)
    const urlParams = new URLSearchParams(window.location.search);
    const selectedCity = urlParams.get('city') || '';

    // Центрируем карту по умолчанию на Израиль
    const map = L.map('map').setView([32.0853, 34.7818], 9);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Динамическое определение источника данных (API)
    const isLocalFile = window.location.protocol === 'file:';
    let apiUrl = isLocalFile ? 'http://localhost:8080/api/events/children' : '/api/events/children';

    if (selectedCity) {
        apiUrl += (apiUrl.includes('?') ? '&' : '?') + 'city=' + encodeURIComponent(selectedCity);
    }

    // Загрузка маркеров на карту
    fetch(apiUrl)
        .then(response => response.json())
        .then(events => {
            if (events.length === 0) {
                alert("В выбранном регионе ивентов с координатами не найдено.");
                return;
            }

            const markers = [];

            events.forEach(event => {
                const marker = L.marker([event.latitude, event.longitude]).addTo(map);

                const popupHtml = `
                    <div class="event-popup">
                        <div class="event-title">${event.title}</div>
                        <div class="event-meta">📅 <b>Когда:</b> ${event.startDate} - ${event.endDate}</div>
                        <div class="event-meta">🏪 <b>Зал:</b> ${event.venueName}</div>
                        <div class="event-meta">📍 <b>Адрес:</b> ${event.address}</div>
                        <a class="popup-link" href="${event.link}" target="_blank">Купить билеты</a>
                    </div>
                `;

                marker.bindPopup(popupHtml);
                markers.push(marker);
            });

            // Автоматически подгоняем зум карты под массив точек
            if (markers.length > 0) {
                const group = new L.featureGroup(markers);
                map.fitBounds(group.getBounds().pad(0.15));
            }
        })
        .catch(err => console.error('Ошибка загрузки JSON бэкенда:', err));
</script>
</body>
</html>
